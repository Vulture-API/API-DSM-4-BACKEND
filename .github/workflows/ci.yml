name: CI Backend

# A suíte completa roda no PR para a dev: é a pipeline da feature. No push da
# dev, o job de procedência confere que entrou o mesmo conteúdo testado no PR e,
# confirmado, não repete a suíte; sem prova, roda tudo. A main não tem gatilho:
# a promoção usa o que ficou registrado no commit da dev.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Em PR, commit novo cancela a execução antiga; na dev, cada merge tem a sua.
concurrency:
  group: ci-backend-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  procedencia:
    name: Procedência do commit na dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      testado: ${{ steps.conferir.outputs.testado }}
    steps:
      - name: Conferir se o conteúdo já foi testado no PR
        id: conferir
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const roda = (motivo) => {
              core.notice(`Suíte completa nesta execução: ${motivo}.`);
              core.setOutput('testado', 'false');
            };
            try {
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: sha });
              if (commit.parents.length !== 2) return roda('o commit não é o merge de um PR');
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
              const pr = prs.find((p) => p.merged_at && p.merge_commit_sha === sha);
              if (!pr) return roda('nenhum PR mesclado gerou este commit');
              const head = pr.head.sha;
              const [{ data: merge }, { data: testado }] = await Promise.all([
                github.rest.git.getCommit({ ...context.repo, commit_sha: sha }),
                github.rest.git.getCommit({ ...context.repo, commit_sha: head }),
              ]);
              if (merge.tree.sha !== testado.tree.sha) return roda(`o conteúdo da dev difere do commit testado no PR #${pr.number}`);
              const { data: comparacao } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${commit.parents[0].sha}...${head}`,
              });
              if (!['ahead', 'identical'].includes(comparacao.status)) return roda(`o PR #${pr.number} não estava atualizado com a dev`);
              const workflow = process.env.GITHUB_WORKFLOW_REF.split('@')[0].split('/').pop();
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflow,
                head_sha: head,
                event: 'pull_request',
                status: 'success',
                per_page: 1,
              });
              const run = runs.workflow_runs[0];
              if (!run) return roda(`não há CI verde no commit ${head.slice(0, 7)} do PR #${pr.number}`);
              core.setOutput('testado', 'true');
              await core.summary
                .addHeading('Procedência confirmada', 3)
                .addRaw(`O commit ${sha.slice(0, 7)} da dev tem o mesmo conteúdo do commit ${head.slice(0, 7)}, testado no PR #${pr.number}. `)
                .addRaw('A suíte do repositório não roda de novo.')
                .addBreak()
                .addLink('Execução que testou este conteúdo', run.html_url)
                .write();
            } catch (erro) {
              roda(`não foi possível conferir (${erro.message})`);
            }

  quality:
    needs: procedencia
    # Roda no PR e em execução manual; no push da dev, só se a procedência não
    # provar que este conteúdo já passou no PR.
    if: ${{ !cancelled() && needs.procedencia.outputs.testado != 'true' }}
    name: Qualidade, integração PostgreSQL e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Auditoria de vulnerabilidades críticas
        run: npm audit --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format
      - name: Tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes de integração (rotas e PostgreSQL)
        run: npm run test:int -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/integracao.json"
      - name: Nenhum teste de integração pulado
        run: |
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/integracao.json');
            const pulados = r.numPendingTests + r.numTodoTests;
            console.log('Integração: ' + r.numTotalTests + ' testes, ' + pulados + ' pulados');
            if (pulados > 0) process.exit(1);
          "
      - name: Cobertura total de testes (DoD 80%)
        run: npm run test:coverage
      - name: Resumo da cobertura
        id: coverage
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then exit 0; fi
          COVERAGE=$(node -p "Math.floor(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "### Cobertura de linhas: ${COVERAGE}% (mínimo 80%)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

  docker:
    name: Build da imagem monolítica
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build sem push ou deploy
        run: docker build -t agritech-backend:ci-${{ github.sha }} .

  comment:
    name: Comentar resultado no PR
    needs: [quality, docker]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Criar ou atualizar o comentário do CI
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
          COVERAGE: ${{ needs.quality.outputs.coverage }}
        with:
          script: |
            const marker = '<!-- vulture-ci-report -->';
            const ok = process.env.QUALITY === 'success' && process.env.DOCKER === 'success';
            const coverage = process.env.COVERAGE || 'n/d';
            const body = [
              marker,
              `${ok ? '✅' : '❌'} **Pipeline de CI: ${ok ? 'aprovado' : 'reprovado'}**`,
              '',
              `- Qualidade, integração PostgreSQL e build: \`${process.env.QUALITY}\``,
              `- Imagem Docker: \`${process.env.DOCKER}\``,
              `- Cobertura de linhas: **${coverage}%** (mínimo 80%)`,
              `- Commit: \`${context.payload.pull_request.head.sha.substring(0, 7)}\``,
              `- [Ver execução completa](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
