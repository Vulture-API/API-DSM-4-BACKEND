name: CI Backend

on:
  pull_request:
    branches: [dev, develop, main]
  push:
    branches: [dev, develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade, integração PostgreSQL e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Auditoria de vulnerabilidades críticas
        run: npm audit --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format
      - name: Tipos
        run: npm run typecheck
      - name: Testes e cobertura mínima de 80% de linhas
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build da imagem monolítica
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build sem push ou deploy
        run: docker build -t agritech-backend:ci-${{ github.sha }} .
