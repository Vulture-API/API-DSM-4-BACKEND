name: CI Backend

on:
  pull_request:
    branches: [dev, develop, main]
  push:
    branches: [dev, develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade, integração PostgreSQL e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Auditoria de vulnerabilidades críticas
        run: npm audit --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format
      - name: Tipos
        run: npm run typecheck
      - name: Testes e cobertura mínima de 80% de linhas
        run: npm run test:coverage
      - name: Resumo da cobertura
        id: coverage
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then exit 0; fi
          COVERAGE=$(node -p "Math.floor(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "### Cobertura de linhas: ${COVERAGE}% (mínimo 80%)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build da imagem monolítica
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build sem push ou deploy
        run: docker build -t agritech-backend:ci-${{ github.sha }} .

  comment:
    name: Comentar resultado no PR
    needs: [quality, docker]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Criar ou atualizar o comentário do CI
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
          COVERAGE: ${{ needs.quality.outputs.coverage }}
        with:
          script: |
            const marker = '<!-- vulture-ci-report -->';
            const ok = process.env.QUALITY === 'success' && process.env.DOCKER === 'success';
            const coverage = process.env.COVERAGE || 'n/d';
            const body = [
              marker,
              `${ok ? '✅' : '❌'} **Pipeline de CI: ${ok ? 'aprovado' : 'reprovado'}**`,
              '',
              `- Qualidade, integração PostgreSQL e build: \`${process.env.QUALITY}\``,
              `- Imagem Docker: \`${process.env.DOCKER}\``,
              `- Cobertura de linhas: **${coverage}%** (mínimo 80%)`,
              `- Commit: \`${context.payload.pull_request.head.sha.substring(0, 7)}\``,
              `- [Ver execução completa](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
